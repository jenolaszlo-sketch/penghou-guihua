name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test-pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build
        run: dotnet build Penghou.Guihua.slnx --configuration Release

      - name: Verify formatting
        run: dotnet format Penghou.Guihua.slnx --verify-no-changes --no-restore

      - name: Test and coverage (core)
        run: >
          dotnet test tests/Penghou.Guihua.Tests/Penghou.Guihua.Tests.csproj
          --configuration Release --no-restore
          /p:CollectCoverage=true
          /p:CoverletOutput=${{ github.workspace }}/coverage/
          /p:CoverletOutputFormat=cobertura
          '/p:Include=[Penghou.Guihua]*'
          /p:Threshold=70
          /p:ThresholdType=line%2cbranch

      - name: Test and coverage (Baize)
        run: >
          dotnet test tests/Penghou.Guihua.Baize.Tests/Penghou.Guihua.Baize.Tests.csproj
          --configuration Release --no-restore
          /p:CollectCoverage=true
          /p:CoverletOutput=${{ github.workspace }}/coverage-baize/
          /p:CoverletOutputFormat=cobertura
          '/p:Include=[Penghou.Guihua.Baize]*'
          /p:Threshold=50
          /p:ThresholdType=line%2cbranch

      - name: Test and coverage (Zhinu)
        run: >
          dotnet test tests/Penghou.Guihua.Zhinu.Tests/Penghou.Guihua.Zhinu.Tests.csproj
          --configuration Release --no-restore
          /p:CollectCoverage=true
          /p:CoverletOutput=${{ github.workspace }}/coverage-zhinu/
          /p:CoverletOutputFormat=cobertura
          '/p:Include=[Penghou.Guihua.Zhinu]*'
          /p:Threshold=45
          /p:ThresholdType=line%2cbranch

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-results
          path: |
            coverage/
            coverage-baize/
            coverage-zhinu/

      - name: Pack
        run: dotnet pack Penghou.Guihua.slnx --configuration Release --no-build --output artifacts --property:PackageVersion=0.0.0-ci.${{ github.run_id }}

      - name: Upload packages
        uses: actions/upload-artifact@v6
        with:
          name: nuget-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error
